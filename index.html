<!doctype html><html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F4F9">
<title>Bsaha</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
 --ink:#1C1722;--ink2:#4A4255;--mut:#9B93A6;--line:#EDE8F0;--bg:#F7F4F9;--card:#FFF;--soft:#F6F3F9;
 --vio1:#5B4B8A;--vio2:#8E7BC4;--grn1:#2F6B54;--grn2:#6BAE8C;--ros1:#A85B5B;--ros2:#E3A091;--blu1:#274B63;--blu2:#6E9EBF;
 --sh1:0 6px 18px -8px rgba(28,23,34,.18),0 0 0 1px rgba(28,23,34,.045);
 --sh2:0 12px 26px -10px rgba(28,23,34,.45);
 --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --ink:#F3F0F6;--ink2:#CFC7D8;--mut:#8A8296;--line:#2B2533;--bg:#131018;--card:#1D1926;--soft:#241F2F;
 --sh1:0 6px 18px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05);
 --sh2:0 12px 26px -10px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
 --ink:#F3F0F6;--ink2:#CFC7D8;--mut:#8A8296;--line:#2B2533;--bg:#131018;--card:#1D1926;--soft:#241F2F;
 --sh1:0 6px 18px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05);
 --sh2:0 12px 26px -10px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);
 font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font-family:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
/* ---- entête ---- */
header{padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 2px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
header h1{font-size:29px;font-weight:800;letter-spacing:-1.1px;line-height:1.08}
header p{font-size:14px;font-weight:600;color:var(--mut);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header>div:first-child{min-width:0}
.hact{display:flex;gap:8px;align-items:center;flex:none}
.chip{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:0;border-radius:999px;min-height:46px;min-width:46px;padding:0 14px;
 box-shadow:var(--sh1);font-size:14px;font-weight:800;letter-spacing:-.3px}
.chip svg{width:17px;height:17px}
/* ---- corps ---- */
main{flex:1;padding:16px 20px calc(96px + var(--sab));display:flex;flex-direction:column;gap:12px}
.ec[hidden]{display:none}
.ec{display:flex;flex-direction:column;gap:12px}
/* ---- cartes couleur ---- */
.card{position:relative;border-radius:28px;padding:20px 22px;color:#fff;overflow:hidden;box-shadow:var(--sh2);
 border:0;width:100%;text-align:left;display:block;font-size:16px}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 8% 0%,rgba(255,255,255,.26),transparent 58%);pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28);pointer-events:none}
.card:active{transform:scale(.985)}
.card,.w,.chip,.nav a{transition:transform .14s ease}
.v{background:linear-gradient(142deg,var(--vio1),var(--vio2))}
.g{background:linear-gradient(142deg,var(--grn1),var(--grn2))}
.r{background:linear-gradient(142deg,var(--ros1),var(--ros2))}
.b{background:linear-gradient(142deg,var(--blu1),var(--blu2))}
.ic{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.ic svg{width:22px;height:22px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;opacity:.74;margin-bottom:3px}
.card h2{font-size:22px;font-weight:800;letter-spacing:-.7px;line-height:1.12}
.card .sub{font-size:13.5px;font-weight:600;opacity:.84;margin-top:5px}
.tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.tags span{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.ring{position:absolute;right:20px;top:20px;width:52px;height:52px}
.ring svg{transform:rotate(-90deg);stroke-width:5}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;letter-spacing:-.4px}
.check{position:absolute;right:18px;bottom:18px;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.45);
 background:transparent;display:flex;align-items:center;justify-content:center;color:#fff}
.check svg{width:22px;height:22px;stroke-width:2.8;opacity:0}
.check.on{background:#fff;border-color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.check.on svg{opacity:1;stroke:var(--grn1)}
.check:active{transform:scale(.9)}
.chev{position:absolute;right:22px;top:50%;margin-top:-11px;width:22px;height:22px;opacity:.75;stroke-width:2.4}
/* ---- blocs blancs ---- */
.w{background:var(--card);border-radius:28px;padding:19px 22px;box-shadow:var(--sh1)}
.lab{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.big{font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:8px}
.big em{font-style:normal;font-size:15px;font-weight:700;color:var(--mut)}
.bar{height:7px;border-radius:99px;background:var(--line);margin-top:13px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--vio1),var(--vio2));transition:width .3s ease}
.split{display:flex;gap:9px;margin-top:13px}
.pa{flex:1;background:var(--soft);border:0;border-radius:18px;padding:13px 10px;text-align:center;min-height:64px;
 box-shadow:inset 0 0 0 1px rgba(28,23,34,.03);position:relative}
.pa b{display:block;font-size:20px;font-weight:800;letter-spacing:-.8px}
.pa i{font-style:normal;display:block;font-size:10.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.pa.on{background:linear-gradient(142deg,var(--grn1),var(--grn2));color:#fff;box-shadow:none}
.pa.on i{color:rgba(255,255,255,.85)}
.pa:active{transform:scale(.96)}
/* ---- duo ---- */
.duo{display:flex;gap:10px;margin-top:15px}
.duo button{flex:1;border:0;border-radius:17px;min-height:52px;font-size:15.5px;font-weight:800;letter-spacing:-.3px;
 display:flex;align-items:center;justify-content:center;gap:7px}
.duo svg{width:18px;height:18px;stroke-width:3}
.duo .y{background:#fff;color:var(--ros1);box-shadow:0 4px 0 rgba(0,0,0,.14)}
.duo .n{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.duo .y.sel{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.duo .n.sel{background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.duo button:active{transform:translateY(2px)}
.bell{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.16);margin:0 auto 11px;
 display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 11px rgba(255,255,255,.07)}
.bell svg{width:38px;height:38px;stroke-width:1.9}
.bell.ok{background:rgba(255,255,255,.95);color:var(--ros1);box-shadow:0 0 0 11px rgba(255,255,255,.14)}
/* ---- listes ---- */
.list{padding:6px 22px}
.row{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid var(--line);
 background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;min-height:64px}
.row:last-child{border-bottom:0}
.row:active{opacity:.6}
.th{width:54px;height:54px;border-radius:17px;flex:none;background:linear-gradient(140deg,var(--soft),var(--line));
 display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--vio1)}
.th img{width:100%;height:100%;object-fit:cover}
.th svg{width:24px;height:24px;stroke-width:1.8}
.rtx{flex:1;min-width:0}
.rtx b{font-size:15.5px;font-weight:700;letter-spacing:-.35px;display:block;line-height:1.25}
.rtx i{font-style:normal;font-size:12.5px;font-weight:600;color:var(--mut)}
.go{width:20px;height:20px;color:var(--mut);opacity:.6;stroke-width:2.4;flex:none}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;
 display:flex;align-items:center;justify-content:center;color:transparent}
.tick svg{width:20px;height:20px;stroke-width:3}
.tick.on{background:linear-gradient(142deg,var(--grn1),var(--grn2));border-color:transparent;color:#fff}
.tick:active{transform:scale(.9)}
/* ---- semaine ---- */
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.gr .d{font-size:10.5px;font-weight:800;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.cell{height:56px;min-width:44px;border-radius:15px;border:0;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;padding:0;
 background:color-mix(in srgb,var(--vio2) 9%,transparent);color:color-mix(in srgb,var(--vio1) 62%,var(--mut))}
.cell u{text-decoration:none;font-size:13px;font-weight:800;color:color-mix(in srgb,var(--vio1) 80%,var(--ink))}
.cell.prev{background:color-mix(in srgb,var(--vio2) 24%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--vio2) 70%,transparent)}
.cell.fait{background:linear-gradient(142deg,var(--grn1),var(--grn2));color:#fff}
.cell.fait u{color:#fff}
.cell.auj{box-shadow:inset 0 0 0 2px var(--vio1)}
.cell.edit{box-shadow:inset 0 0 0 2px var(--vio2);opacity:1}
.cell.edit:not(.prev){background:transparent;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--vio2) 35%,transparent)}
.cell.edit:not(.prev) span{color:var(--vio1);font-size:17px;font-weight:800}
.cell.edit:active{transform:scale(.92)}
.ltete{font-size:12px;font-weight:800;color:var(--ink2);margin:14px 0 2px;letter-spacing:-.2px}
.wsem{background:var(--card);border-radius:28px;padding:16px 10px;box-shadow:var(--sh1)}
main>.ec>.wsem{margin:0 -6px}
/* ---- suivi ---- */
.vs{display:flex;gap:10px}
.vs>div{flex:1;border-radius:24px;padding:16px 14px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.vs>div::before{content:"";position:absolute;inset:0;background:radial-gradient(110% 80% at 10% 0%,rgba(255,255,255,.25),transparent 60%)}
.vs i{font-style:normal;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;opacity:.82}
.vs b{display:block;font-size:26px;font-weight:800;letter-spacing:-1.3px;margin-top:4px}
.vs u{text-decoration:none;font-size:11.5px;font-weight:700;opacity:.8;display:block;margin-top:2px}
.chart{height:118px;margin:14px 0 8px}
.chart svg{width:100%;height:100%;overflow:visible;stroke-width:3}
.lg{display:flex;gap:16px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.lg s{text-decoration:none;display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px}
.cta{border:0;width:100%;border-radius:20px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;letter-spacing:-.3px;
 background:var(--ink);color:var(--bg);margin-top:14px;box-shadow:0 8px 18px -6px rgba(28,23,34,.45)}
.cta.gh{background:linear-gradient(142deg,var(--vio1),var(--vio2));color:#fff}
.cta:active{transform:scale(.98)}
.cta svg,.cta2 svg{width:19px;height:19px;flex:none}
.cta2{border:0;width:100%;border-radius:18px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;background:var(--soft);color:var(--ink);margin-top:10px}
/* ---- nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
 background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);
 border-top:1px solid var(--line);padding:8px 12px calc(10px + var(--sab))}
nav .int{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;
 padding:8px 0;border-radius:16px;min-height:56px;color:var(--mut)}
nav svg{width:23px;height:23px;stroke-width:1.9}
nav span{font-size:10.5px;font-weight:700}
nav button.on{color:var(--vio1);background:color-mix(in srgb,var(--vio2) 14%,transparent)}
nav button.on svg{stroke-width:2.2}
nav button.on span{font-weight:800}
/* ---- overlay ---- */
#ov{position:fixed;inset:0;z-index:60;background:rgba(15,12,20,.5);backdrop-filter:blur(3px);display:none;align-items:flex-end}
#ov.on{display:flex}
#ovc{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:30px 30px 0 0;
 max-height:92vh;overflow-y:auto;padding:10px 20px calc(28px + var(--sab));-webkit-overflow-scrolling:touch}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 14px}
.ovh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.ovh h2{font-size:24px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.ovh p{font-size:13px;font-weight:600;color:var(--mut);margin-top:4px}
.x{width:46px;height:46px;min-width:46px;min-height:46px;align-self:center;border-radius:50%;background:var(--card);border:0;box-shadow:var(--sh1);flex:none;
 display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.x svg{width:19px;height:19px;stroke-width:2.6}
.ph2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ph2 figure{border-radius:20px;overflow:hidden;background:var(--soft);position:relative;aspect-ratio:1/1}
.ph2 img{width:100%;height:100%;object-fit:cover;display:block}
.ph2 figcaption{position:absolute;left:8px;bottom:8px;background:rgba(15,12,20,.65);color:#fff;font-size:10.5px;
 font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.sect{margin-top:16px}
.sect h3{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:7px}
.sect p{font-size:14.5px;line-height:1.5;color:var(--ink2)}
.sect ol,.sect ul{padding-left:19px;display:flex;flex-direction:column;gap:6px}
.sect li{font-size:14.5px;line-height:1.45;color:var(--ink2)}
label.f{display:block;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 6px}
input.f,select.f{width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);
 padding:0 16px;font-size:16px;font-weight:600}
.nums{display:flex;gap:10px}
.toastw{position:fixed;left:0;right:0;bottom:calc(84px + var(--sab));z-index:80;display:flex;justify-content:center;pointer-events:none}
.toastw div{background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 20px;font-size:14px;font-weight:700;
 box-shadow:0 10px 24px -8px rgba(0,0,0,.5);opacity:0;transform:translateY(8px);transition:.2s}
.toastw.on div{opacity:1;transform:none}
.mini{font-size:12.5px;font-weight:700;color:var(--mut)}
.nut{margin-top:14px}
.nut:first-of-type{margin-top:10px}
.nk{font-size:26px;font-weight:800;letter-spacing:-1.1px;line-height:1}
.nk em{font-style:normal;font-size:14px;font-weight:700;color:var(--mut);letter-spacing:-.2px}
.rest{font-size:12px;font-weight:700;color:var(--mut);margin-top:6px}
.lien{background:none;border:0;font-size:12.5px;font-weight:800;color:var(--vio1);padding:6px 2px;min-height:auto}
.jal{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.jal.first{margin-top:10px;padding-top:0;border-top:0}
.jt{font-size:15px;font-weight:800;letter-spacing:-.3px}
.jc{font-size:15px;font-weight:800;color:var(--vio1)}
.mac{display:block;color:var(--vio1);font-weight:700}
.aide{width:30px;height:30px;min-width:30px;border-radius:50%;border:1.5px solid var(--line);background:none;
 color:var(--mut);font-size:13px;font-weight:800;flex:none;align-self:center;margin-right:2px}
.aide:active{transform:scale(.9)}
.ph1{border-radius:22px;overflow:hidden;background:var(--soft);margin-bottom:12px;max-height:260px}
.ph1 img{width:100%;height:100%;object-fit:cover;display:block;max-height:260px}
.cta2.gros{min-height:58px;font-size:16px;font-weight:800;background:linear-gradient(142deg,var(--ros1),var(--ros2));color:#fff;box-shadow:0 8px 18px -8px rgba(168,91,91,.6)}
.cta2.danger{color:#C2554E;background:color-mix(in srgb,#C2554E 10%,transparent)}
.pa b svg{width:20px;height:20px;stroke:var(--ink)}
.row .rtx i.mac{font-size:12px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mut)}
.sync s{text-decoration:none;width:8px;height:8px;border-radius:99px;background:var(--mut)}
.sync.ok s{background:var(--grn2)}
.sync.local s{background:#E0A93C}
</style></head>
<body>
<div id="app">
 <header>
  <div><h1 id="h-t">Bsaha</h1><p id="h-s"></p></div>
  <div class="hact">
   <button class="chip" id="b-streak" aria-label="Série"></button>
   <button class="chip" id="b-profil" aria-label="Changer de profil"></button>
  </div>
 </header>
 <main>
  <section class="ec" id="ec-jour"></section>
  <section class="ec" id="ec-semaine" hidden></section>
  <section class="ec" id="ec-exos" hidden></section>
  <section class="ec" id="ec-suivi" hidden></section>
 </main>
 <nav><div class="int">
  <button data-t="jour" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Jour</span></button>
  <button data-t="semaine"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg><span>Semaine</span></button>
  <button data-t="exos"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg><span>Exos</span></button>
  <button data-t="suivi"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-8"/><path d="M20 7h-4M20 7v4"/></svg><span>Suivi</span></button>
 </div></nav>
</div>
<div id="ov"><div id="ovc"><div class="grab"></div><div id="ovb"></div></div></div>
<div class="toastw" id="tw"><div id="tt"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="data.js" defer></script>
<script src="app.js" defer></script>
</body></html>
