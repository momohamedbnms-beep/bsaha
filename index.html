<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bsaha">
<meta name="theme-color" content="#FAFAF8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Bsaha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FAFAF8; --surf:#FFFFFF; --line:#ECEAE6; --txt:#1B1A1F; --txt2:#6E6B75;
  --mo:#8B7CF6; --mo-l:#EEEBFE; --fifi:#F2A7A0; --fifi-l:#FDECEA;
  --ok:#7FB69B; --ok-l:#E6F2EC; --off:#D9D6D0;
  --moi:var(--mo); --moi-l:var(--mo-l);
  --r:16px; --omb:0 1px 3px rgba(0,0,0,.06);
  --t1:22px; --t2:16px; --t3:13px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141317; --surf:#1D1C21; --line:#2C2A31; --txt:#F2F1EE; --txt2:#A29FAA;
  --mo-l:#2A2445; --fifi-l:#3A2724; --ok-l:#1F3029; --off:#3A3740; --omb:0 1px 3px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{--bg:#141317;--surf:#1D1C21;--line:#2C2A31;--txt:#F2F1EE;--txt2:#A29FAA;--mo-l:#2A2445;--fifi-l:#3A2724;--ok-l:#1F3029;--off:#3A3740;--omb:0 1px 3px rgba(0,0,0,.4)}
:root[data-p="firdaous"]{--moi:var(--fifi);--moi-l:var(--fifi-l)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Poppins',system-ui,-apple-system,sans-serif;font-size:var(--t2);line-height:1.4;-webkit-font-smoothing:antialiased;font-weight:500;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--moi);outline-offset:2px}
img{max-width:100%;display:block}
input,select{font-size:16px;font-family:inherit;font-weight:500;color:var(--txt);background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
h1{font-size:var(--t1);font-weight:700;margin:0;letter-spacing:-.02em}
h2{font-size:var(--t2);font-weight:600;margin:0}
p{margin:0}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* En-tête */
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
.jour-titre{font-size:var(--t1);font-weight:700;letter-spacing:-.02em}
.qui{display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:4px}
.qui button{padding:8px 18px;border-radius:999px;font-size:var(--t3);font-weight:600;color:var(--txt2);min-height:44px}
.qui button[data-p="mohamed"].on{background:var(--mo-l);color:var(--mo)}
.qui button[data-p="firdaous"].on{background:var(--fifi-l);color:var(--fifi)}

main{flex:1;padding:0 16px 120px;display:flex;flex-direction:column;gap:12px}
.ec[hidden]{display:none}
.c{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--omb);display:flex;flex-direction:column;gap:14px}
.lab{font-size:var(--t3);font-weight:600;color:var(--txt2)}
.ligne{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* Case à cocher géante */
.case{width:56px;height:56px;border-radius:999px;border:2px solid var(--off);display:grid;place-items:center;flex:0 0 auto;transition:transform .12s ease,background .12s ease}
.case svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.case.on{background:var(--ok);border-color:var(--ok)}
.case.on svg{opacity:1}
.case:active{transform:scale(.92)}
.pop{animation:pop .22s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}

/* Pastilles repas */
.pastilles{display:flex;gap:10px;flex-wrap:wrap}
.pa{width:52px;height:52px;border-radius:999px;border:2px solid var(--off);display:grid;place-items:center;font-size:var(--t3);font-weight:700;color:var(--txt2);transition:transform .12s ease}
.pa.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pa.sh{border-style:dashed}
.pa.sh.on{border-style:solid}
.pa:active{transform:scale(.92)}
.cpt{font-size:var(--t2);font-weight:700;color:var(--txt2)}

/* Barre de progression */
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s ease}

/* Boutons */
.b{min-height:52px;padding:0 20px;border-radius:999px;font-weight:600;font-size:var(--t2);background:var(--moi);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.b.s{background:var(--surf);color:var(--txt);border:1px solid var(--line)}
.b.p{min-height:44px;font-size:var(--t3);padding:0 16px}
.b:active{transform:scale(.98)}
.b[disabled]{opacity:.4}

/* Grille semaine */
.sem-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sem-nav button{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;font-size:18px;color:var(--txt2)}
.grille7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;align-items:center;touch-action:pan-y}
.ligne-tete{display:flex;align-items:center;gap:10px;padding:2px 2px 0}
.ligne-tete .sc{margin-left:auto;font-size:var(--t3);font-weight:700;color:var(--txt2)}
.gj{font-size:11px;font-weight:600;color:var(--txt2);text-align:center;text-transform:uppercase;letter-spacing:.03em}
.gj.auj{color:var(--moi)}
.gtete{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700}
.gtete.m{background:var(--mo-l);color:var(--mo)}
.gtete.f{background:var(--fifi-l);color:var(--fifi)}
.cell{height:48px;border-radius:12px;display:grid;place-items:center;font-size:var(--t3);font-weight:700;border:1.5px solid transparent;background:var(--line);color:var(--txt2);transition:transform .12s ease}
.cell.vide{background:transparent;border:1.5px solid var(--line);color:var(--off)}
.cell.prevu-m{background:var(--mo-l);color:var(--mo)}
.cell.prevu-f{background:var(--fifi-l);color:var(--fifi)}
.cell.fait{background:var(--ok);color:#fff;border-color:var(--ok)}
.cell.rate{background:transparent;border:1.5px dashed var(--off);color:var(--off)}
.cell.auj{box-shadow:0 0 0 2px var(--moi)}
.cell:active{transform:scale(.94)}
.colauj{background:var(--moi-l);border-radius:12px}
.scores{display:flex;gap:16px;justify-content:center;font-size:var(--t2);font-weight:700}
.scores span i{font-style:normal;color:var(--txt2);font-weight:500}

#grille-c{padding:18px 10px;gap:8px}

/* Exos */
.exo{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.exo:last-child{border-bottom:0}
.exo .txt{flex:1;min-width:0}
.exo .nom{font-weight:600;font-size:var(--t2)}
.exo .det{font-size:var(--t3);color:var(--txt2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.exo .det input{width:66px;min-height:36px;padding:6px 8px;text-align:center;border-radius:8px}
.exo .regle{font-size:var(--t3);color:var(--txt2);opacity:.8}
.case.p{width:44px;height:44px}
.case.p svg{width:20px}
.vign{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--line);flex:0 0 auto}
.seances{display:flex;flex-direction:column;gap:12px}

/* Photo du jour */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;width:100%;min-height:44px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .pt{position:absolute;left:6px;top:6px;z-index:2;width:22px;height:22px;border-radius:999px;font-size:10px;font-weight:700;display:grid;place-items:center}
.slot .pt.m{background:var(--mo);color:#fff}.slot .pt.f{background:var(--fifi);color:#fff}
.slot .plus{font-size:24px;color:var(--off);font-weight:300}

/* Coach */
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto}
.bulle{padding:12px 15px;border-radius:16px;max-width:86%;font-size:var(--t2);white-space:pre-wrap;overflow-wrap:anywhere}
.bulle.moi{align-self:flex-end;background:var(--moi);color:#fff;border-bottom-right-radius:5px}
.bulle.co{align-self:flex-start;background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:5px}
.bulle img{border-radius:10px;margin-bottom:8px}
.saisie{display:flex;gap:8px;align-items:flex-end}
.saisie input{flex:1}
.ic{width:52px;height:52px;border-radius:999px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.ic svg{width:22px;height:22px;stroke:var(--txt2);fill:none;stroke-width:2;stroke-linecap:round}

/* Réglages */
.rg{display:flex;flex-direction:column;gap:10px}
.rg label{font-size:var(--t3);font-weight:600;color:var(--txt2)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-size:20px;font-weight:600;display:grid;place-items:center}
.stepper b{font-size:var(--t1);min-width:28px;text-align:center}
.sw{width:56px;height:44px;position:relative;flex:0 0 auto;background:none}
.sw::before{content:'';position:absolute;top:7px;left:2px;width:52px;height:30px;border-radius:999px;background:var(--off);transition:background .18s}
.sw.on::before{background:var(--ok)}
.sw i{position:absolute;top:10px;left:5px;width:24px;height:24px;border-radius:999px;background:#fff;transition:transform .18s;display:block;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on i{transform:translateX(20px)}

/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav .int{max-width:488px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 20px rgba(0,0,0,.08);pointer-events:auto}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:999px;font-size:11px;font-weight:600;color:var(--txt2);min-height:52px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--moi-l);color:var(--moi)}
nav button[hidden]{display:none}

/* Overlay */
#ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
#ov .int{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.retour{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--txt2);font-size:var(--t3)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--txt);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:var(--t3);font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.vide-msg{color:var(--txt2);font-size:var(--t3);text-align:center;padding:24px 0}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-weight:600;padding:0 16px;text-align:left}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="jour-titre" id="titre">—</div>
    <div class="qui" id="qui">
      <button data-p="mohamed" class="on">Mo</button>
      <button data-p="firdaous">Fifi</button>
    </div>
  </header>
  <main>
    <section class="ec" id="ec-jour"></section>
    <section class="ec" id="ec-semaine" hidden></section>
    <section class="ec" id="ec-exos" hidden></section>
    <section class="ec" id="ec-reglages" hidden></section>
    <section class="ec" id="ec-coach" hidden></section>
  </main>
  <nav><div class="int" id="nav">
    <button data-t="jour" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Jour</button>
    <button data-t="semaine"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semaine</button>
    <button data-t="exos"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Exos</button>
    <button data-t="coach" hidden><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Coach</button>
    <button data-t="reglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Réglages</button>
  </div></nav>
</div>
<div id="ov" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="data.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
